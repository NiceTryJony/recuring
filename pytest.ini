[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# perf-тесты (Playwright, реальный браузер) в обычный прогон и CI не входят —
# запускаются явно: pytest -m perf -s (см. tests/perf/test_dashboard_perf.py).
addopts = -m "not perf"
markers =
    integration: требует реальный Postgres (переменная TEST_DATABASE_URL)
    perf: замер производительности дашборда в headless Chromium (нужен playwright)
